<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>图片置入 PS · 首次设置</title>
<style>body{margin:0;background:#f5f7fb;color:#23324a;font:15px "Source Han Sans CN",sans-serif}main{max-width:620px;margin:70px auto;padding:32px;background:white;border:1px solid #e0e7f0;border-radius:16px}h1{font-size:24px}p,li{line-height:1.9;color:#52647b}code{display:block;padding:16px;background:#edf3ff;border-radius:8px;overflow-wrap:anywhere;font-size:13px}button{padding:10px 18px;border:1px solid #bfd0ef;background:#2563eb;color:white;border-radius:7px;cursor:pointer;margin-top:16px}button+button{margin-left:8px;background:white;color:#2563eb}#status{min-height:28px;color:#2563eb}</style></head>
<body><main><h1>首次连接 Photoshop</h1><p>已自动获取本插件 ID。浏览器需要本机组件才能把图片置入 Photoshop，只需设置一次。</p><ol><li>打开本插件所在文件夹（内含 install-ps-native.ps1）。</li><li>在文件夹空白处右键，选择“在终端中打开”，使用 PowerShell。</li><li>复制下方命令，粘贴到终端并执行。</li></ol><code id="command"></code><button id="copy">复制安装命令</button><button id="check">检测连接</button><p id="status" role="status"></p><p>安装完成后点击“检测连接”，再返回网页重试。无需手动填写插件 ID。安装脚本会注册当前用户的浏览器通信组件，并保留已有插件授权。需要电脑已安装 Node.js。</p></main><script src="ps-setup.js"></script></body></html>
