<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>极限词库</title><style>
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:#fff;color:#24344b;font:13px "Source Han Sans CN","思源黑体 CN",system-ui,sans-serif}main{height:100%;display:flex;flex-direction:column;padding:24px;min-height:0}.library-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}h2{margin:0;font-size:20px;letter-spacing:.3px;color:#172941}.library-close{display:grid;place-items:center;width:30px;height:30px;padding:0;border:0;background:#f1f4f8;color:#718198;font-size:23px;line-height:1;border-radius:7px}.toolbar{display:grid;grid-template-columns:minmax(150px,1.2fr) 170px minmax(140px,1fr) auto;gap:9px;margin-bottom:14px}input,select,button{font:inherit;color:#40536f;border:1px solid #dce4ef;border-radius:7px;background:white;padding:8px 10px;min-height:35px}input{min-width:0;width:100%}input:focus,select:focus{outline:2px solid #dbe8ff;border-color:#88aff0}button{cursor:pointer;white-space:nowrap;font-weight:500}button:hover{background:#edf4ff;border-color:#b5cef5}button.primary{background:#2563eb;border-color:#2563eb;color:#fff}button.primary:hover{background:#1d55ce}button:focus-visible{outline:2px solid #93b8ff;outline-offset:2px}#list{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#c3cddc transparent;border:1px solid #e2e8f1;border-radius:9px;padding:4px 14px 12px;background:#fafbfd}h3{margin:16px 0 9px;font-size:12px;font-weight:600;color:#647995}.row{display:flex;gap:7px;align-items:center;margin:6px 0}.row input{flex:1;background:#fff}.row button{font-size:12px;padding:6px 11px;min-height:33px}.row button:last-child{color:#9b6066;background:transparent;border-color:transparent}.row button:last-child:hover{background:#fff0f1;border-color:#f4d5d9}p{margin:12px 0 4px;font-size:11px;line-height:1.6;color:#8a97a9}#status{font-size:11px;color:#5479a9;min-height:16px}footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:12px;margin-top:8px;border-top:1px solid #e8edf4}footer button:last-child{margin-left:auto}footer select,footer button{font-size:12px;min-height:33px}#file{display:none}
@media(max-width:600px){main{padding:14px}.library-header{margin-bottom:12px}h2{font-size:17px}.toolbar{grid-template-columns:1fr auto;gap:6px}.toolbar input:first-child{grid-column:1/-1}.toolbar select{max-width:145px}.toolbar #newWord{grid-column:1}.toolbar #add{grid-column:2}footer{gap:5px}footer button:last-child{margin-left:0}input,select,button{font-size:12px;padding:6px}.row{gap:4px}.row button{padding:6px}p{font-size:10px}}
@media(max-width:600px){
main{padding:16px 14px;background:#fff}.library-header{margin-bottom:14px;min-height:28px}h2{font-size:17px;line-height:28px}.library-close{width:28px;height:28px;background:transparent;color:#78879c}.library-close:hover{background:#edf3fb}.toolbar{grid-template-columns:minmax(0,1fr) 116px;gap:7px;margin-bottom:4px}.toolbar input:first-child{grid-column:1}.toolbar select{grid-column:2;width:116px;max-width:none}.toolbar #newWord{grid-column:1}.toolbar #add{grid-column:2;width:100%;min-height:32px}input,select,button{min-height:32px;font-size:11px;border-color:#e0e6ee}.toolbar input{background:#f8fafc}#list{padding:0 3px 8px 0;border:0;border-radius:0;background:#fff;margin-top:8px;scrollbar-gutter:stable}h3{margin:12px 0 8px;font-size:11px;line-height:1.5;color:#7a8aa1;font-weight:500}.row{gap:5px;margin:5px 0}.row input{min-height:31px;padding:6px 8px;border-color:#e5eaf1;background:#fafbfd}.row button{min-height:29px;padding:5px 7px;font-size:10px;border-color:transparent;background:transparent;color:#4e78af}.row button:hover{background:#edf4ff}.row button:last-child{color:#9b777b}p{margin:10px 0 3px;color:#96a1b1;font-size:10px;line-height:1.6}#status{min-height:14px;font-size:10px}footer{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-top:10px;margin-top:5px}footer select,footer button{min-width:0;width:100%;min-height:30px;font-size:10px;padding:5px 6px}footer button:last-child{margin-left:0}footer #reset{color:#8c7880;border-color:transparent;background:transparent}footer #done{background:#2563eb;color:#fff;border-color:#2563eb}}
</style><main><header class="library-header"><h2>极限词库</h2><button id="closeLibrary" class="library-close" aria-label="关闭词库" title="关闭词库">×</button></header><div class="toolbar"><input id="search" placeholder="搜索词语或分类"><select id="category"></select><input id="newWord" placeholder="输入风险词"><button id="add" class="primary">新增</button></div><div id="list"></div><p>排查结果仅供参考，请以平台规则和人工审核为准。</p><div id="status" role="status"></div><footer><select id="mode"><option value="append">追加导入</option><option value="replace">覆盖导入</option></select><button id="import">导入词库</button><select id="format"><option>JSON</option><option>TXT</option></select><button id="export">导出词库</button><button id="reset">恢复默认</button><button id="done" class="primary">完成</button></footer><input id="file" type="file" accept=".json,.txt" hidden></main><script src="word-library.js"></script></html>
