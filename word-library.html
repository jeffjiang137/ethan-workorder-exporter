<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>极限词库</title><style>body{font:14px system-ui;color:#17233a;background:#f3f6fc;margin:0;padding:24px}main{max-width:1000px;margin:auto;background:white;border-radius:16px;padding:24px}h2{margin-top:0}.toolbar,footer,.row{display:flex;gap:10px;align-items:center;margin:10px 0}input,select,button{font:inherit;border:1px solid #c6d7ef;border-radius:8px;padding:9px;background:white;color:#173660}input{flex:1;min-width:0}button{cursor:pointer;white-space:nowrap}button.primary{background:#347bff;color:white}#list{height:60vh;overflow:auto;border:1px solid #dce6f5;border-radius:10px;padding:16px}h3{color:#2468ff}footer{flex-wrap:wrap}#status{color:#637a99}footer button:last-child{margin-left:auto}</style><main><h2>极限词库</h2><div class="toolbar"><input id="search" placeholder="搜索词语或分类"><select id="category"></select><input id="newWord" placeholder="输入风险词"><button id="add" class="primary">新增</button></div><div id="list"></div><p>排查结果仅供参考，请以平台规则和人工审核为准。</p><div id="status" role="status"></div><footer><select id="mode"><option value="append">追加导入</option><option value="replace">覆盖导入</option></select><button id="import">导入词库</button><select id="format"><option>JSON</option><option>TXT</option></select><button id="export">导出词库</button><button id="reset">恢复默认</button><button id="done" class="primary">完成</button></footer><input id="file" type="file" accept=".json,.txt" hidden></main><script src="word-library.js"></script></html>
