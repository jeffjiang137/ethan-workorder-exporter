<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ethan 工单助手</title>
  <style>
    *{box-sizing:border-box}
    body{width:350px;margin:0;padding:12px;font-family:"思源黑体 CN","Source Han Sans CN","PingFang SC",sans-serif;color:#222;background:#fff}
    h1{font-size:16px;margin:0 0 10px}
    .setting,.link-tools,.material-tools{margin-bottom:10px}
    .setting-title{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;font-size:13px;font-weight:700;color:#444}
    .setting-title>span:first-child{flex-shrink:0}
    .operator-row{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:6px}
    input{width:100%;height:32px;border:1px solid #dcdfe6;border-radius:6px;padding:0 8px;outline:none;background:#fff;font:inherit;font-size:13px;color:#303133}
    input:focus{border-color:#67c23a;box-shadow:0 0 0 2px rgba(103,194,58,.12)}
    .actions,.material-tools{display:grid;gap:5px}
    .actions{grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #eceef1;padding-top:9px}
    .actions button{padding-inline:3px;font-size:12px}
    .link-tools textarea{min-height:46px;background:#fff;font-size:12px}
    #openProductLinks{margin-top:5px;border:1px solid #79bbff;background:#ecf5ff;color:#337ecc}
    #openBatchCollector{border:1px solid #cfd6df;background:#f5f7fa}
    #downloadAllTabMaterials{border:1px solid #8e6bd1;background:#f3efff;color:#6941a5}
    #linkStatus,#batchCollectorStatus,#materialStatus{font-size:11px;color:#52647b;line-height:1.45;white-space:pre-wrap}
    #linkStatus:not(:empty){margin-top:4px}
    button{width:100%;min-height:32px;border-radius:6px;padding:5px 8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:#222}
    button:hover{filter:brightness(.97)}
    button:disabled{cursor:wait;opacity:.7}
    #saveOperator{border:1px solid #c2e7b0;background:#f0f9eb;color:#367d23}
    #extract{border:1px solid #d6a400;background:#f2b705}
    #stats{border:1px solid #0ca960;background:#19c777;color:#073a23}
    #todayStats{border:1px solid #79bbff;background:#ecf5ff;color:#337ecc}
    #settingStatus{font-size:11px;font-weight:400;color:#367d23;overflow-wrap:anywhere}
    #status{margin-top:5px;font-size:12px;color:#8a6700;text-align:center}
    [role="status"]:empty{margin:0;padding:0}
    .material-tools [role="status"]:empty{display:none}
    .result{display:none;margin-top:6px}
    .result.show{display:block}
    textarea{display:block;width:100%;min-height:56px;resize:vertical;border:1px solid #d9d9d9;border-radius:6px;padding:6px 8px;font-family:inherit;font-size:13px;line-height:1.4;color:#222;background:#fafafa}
    #copyStats{margin-top:8px;border:1px solid #bbb;background:#f3f3f3;font-size:13px;padding:8px 10px}
    .operator-tag{position:relative;display:inline-flex;align-items:center;margin:3px 4px 0 0;padding:2px 7px;border:1px solid #c2e7b0;border-radius:6px;background:#f0f9eb}
    .operator-tag button{width:auto;min-height:0;border:0;filter:none}
    .operator-tag-name{padding:2px 0;background:transparent;color:#367d23;font-size:12px;font-weight:400}
    .operator-tag-name[aria-pressed="true"]{font-weight:700}
    .operator-tag .operator-tag-remove{position:absolute;top:-6px;right:-6px;z-index:1;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;padding:0;border-radius:50%;background:#e4e7ed;color:#606266;font-size:14px;line-height:1;opacity:0}
    .operator-tag:hover .operator-tag-remove,.operator-tag:focus-within .operator-tag-remove{opacity:1}
    .operator-tag .operator-tag-remove:hover,.operator-tag .operator-tag-remove:focus-visible{background:#f56c6c;color:#fff}
    #operatorUndo{font-size:11px;color:#606266;margin-top:4px}
    #operatorUndo:empty{display:none}
    #operatorUndo button{width:auto;min-height:0;padding:2px 4px;border:0;background:transparent;color:#337ecc;font-size:11px}
    #getPageProductLinks{width:auto;min-height:24px;padding:3px 6px;font-size:11px;border:1px solid #c2e7b0;background:#f0f9eb;color:#367d23}
    #saveProductLinksTxt{width:auto;min-height:24px;padding:3px 6px;font-size:11px;margin-top:0;border:1px solid #dcdfe6;background:#f5f7fa;color:#606266}
    #clearProductLinks{width:auto;min-height:24px;margin-left:auto;padding:3px 6px;font-size:11px;font-weight:400;border:1px solid #e4e7ed;background:#f5f7fa;color:#909399}
    .product-action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:5px}
    .product-action-grid #openProductLinks,.product-action-grid #saveProductLinksTxt{margin-top:0}
    .link-tools > .setting-title{flex-wrap:nowrap;gap:5px}
    .link-tools > .setting-title button{white-space:nowrap;flex-shrink:0;margin:0}
    #getPageProductLinks{flex:1;min-width:0}
    #getShopProductLinks{width:auto;min-height:24px;padding:3px 6px;font-size:11px;border:1px solid #c2e7b0;background:#f0f9eb;color:#367d23}
    .linked-download-box{margin-top:6px;border:1px solid #79bbff;border-radius:7px;background:#ecf5ff;overflow:hidden}
    #downloadLinkedProducts{min-height:40px;border:0;border-radius:0;background:transparent;color:#2563eb;font-size:15px}
    .linked-download-options{display:flex;justify-content:space-around;padding:0 7px 9px;gap:7px}
    .linked-download-options label{display:flex;align-items:center;gap:3px;white-space:nowrap;font-size:12px;color:#42607b;cursor:pointer}
    .linked-download-options input{width:13px;height:13px;margin:0;padding:0;accent-color:#2563eb}
    .product-action-grid #saveProductLinksTxt{width:100%;min-height:32px;font-size:13px}
    .linked-download-box{position:relative}
    #toggleLinkedDownload{position:absolute;right:6px;top:7px;width:auto;min-height:25px;padding:3px 6px;border:1px solid #93b4ef;background:#fff;color:#2563eb;font-size:11px}
    .linked-queue-controls{position:absolute;right:6px;top:7px;display:flex;gap:4px;align-items:center}
    .linked-queue-controls #toggleLinkedDownload,.linked-queue-controls #retryUnfinishedProducts{position:static;width:auto;min-height:25px;padding:3px 5px;border:1px solid #93b4ef;border-radius:5px;background:#fff;color:#2563eb;font-size:10px;white-space:nowrap}
    .linked-queue-controls #endLinkedTask{width:auto;min-height:25px;padding:3px 5px;border:1px solid #f3b5b5;border-radius:5px;background:#fff5f5;color:#c24141;font-size:10px;white-space:nowrap}
    .linked-download-box #downloadLinkedProducts{padding:5px 8px;text-align:center;min-height:40px;font-size:12px;white-space:nowrap}
    .linked-download-box:has(.linked-queue-controls button:not([hidden])) #downloadLinkedProducts{text-align:left;padding-left:46px}
    .linked-download-box .linked-queue-controls{top:7px;gap:3px}
    .linked-queue-controls #endLinkedTask,.linked-queue-controls #retryUnfinishedProducts,.linked-queue-controls #toggleLinkedDownload{padding:3px 4px;font-size:10px;white-space:nowrap;flex-shrink:0}

    /* Compact visual system: neutral surfaces, blue actions, clear task groups. */
    body{padding:14px;background:#f5f7fb;color:#23324a;font-size:12px}
    h1{font-size:16px;letter-spacing:.2px;margin:0 0 14px;color:#172941;display:flex;align-items:center;gap:9px}
    h1:before{content:'';display:block;flex-shrink:0;width:30px;height:30px;background:url('icons/icon128.png') center/contain no-repeat}
    button{border:1px solid #dce3ed;background:#fff;color:#43536a;font-weight:600;transition:background .15s,border-color .15s;box-shadow:none}
    button:hover{filter:none;background:#edf3ff;border-color:#b0c9f4}
    button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #93b8ff;outline-offset:2px}
    button:disabled{opacity:.55}
    .setting{margin-bottom:12px}.setting-title{align-items:center;color:#65758c;font-size:11px;gap:6px;margin-bottom:7px}
    .operator-row{gap:7px;grid-template-columns:minmax(0,1fr) 54px}
    input,textarea{border-color:#dce3ed;border-radius:7px;color:#30425d;background:#fff}
    input:focus,textarea:focus{border-color:#7fa9f0;box-shadow:0 0 0 2px #2563eb0d;outline:none}
    .operator-tag{margin:0 4px 0 0;padding:0;border-color:#dce3ed;background:#fff;border-radius:5px}
    .operator-tag-name{color:#62718a;font-size:11px;padding:3px 6px;border-radius:4px}
    .operator-tag:hover,.operator-tag:focus-within{background:#edf3ff;border-color:#b0c9f4}
    .operator-tag .operator-tag-name:hover{background:transparent}
    .operator-tag:has([aria-pressed="true"]):hover{background:#dce9ff;border-color:#93b8ff}.operator-tag:has([aria-pressed="true"]){background:#eaf1ff;border-color:#b8d0fa}.operator-tag-name[aria-pressed="true"]{color:#2563eb}
    #saveOperator{background:#eaf1ff;border-color:#ccdcf8;color:#2563eb}
    .link-tools{padding:10px;background:#fff;border:1px solid #e0e7f0;border-radius:10px;margin-bottom:10px}
    .link-tools>.setting-title{gap:5px;margin-bottom:7px}
    #getPageProductLinks,#getShopProductLinks{background:#f0f5ff;border-color:#dae5f8;color:#3566a6;min-height:26px;font-size:10px;padding:3px 5px}
    #clearProductLinks{background:#fff;border-color:#e4e9f1;color:#8995a8;font-size:10px;min-height:26px;padding:3px 5px}
    .link-tools textarea{padding:7px 8px;min-height:58px;line-height:1.55;font-size:11px;background:#fafbfd;resize:vertical}
    .product-action-grid{gap:6px;margin-top:7px}
    .product-action-grid button,.product-action-grid #saveProductLinksTxt{min-height:32px;font-size:11px;border-radius:6px;font-weight:600}
    #openProductLinks{background:#edf4ff;border-color:#d3e2fb;color:#2d67b4}
    #saveProductLinksTxt,#openBatchCollector{background:#fff;border-color:#dce3ed;color:#52637a}
    #downloadAllTabMaterials{background:#f3f0fc;border-color:#e0d8f5;color:#7357a6}
    .linked-download-box{margin-top:9px;border-color:#b7d0fb;background:#edf4ff;border-radius:8px;padding:0 0 1px;display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;column-gap:4px}
    .linked-download-box #downloadLinkedProducts{grid-column:2;grid-row:1;min-height:38px;font-size:12px;padding:4px 0!important;text-align:center!important;color:#2563eb;overflow:hidden;text-overflow:ellipsis}
    #linkedSpeedMode{position:static!important;grid-column:1;grid-row:1;margin-left:6px;width:34px!important;height:23px!important;font-size:10px!important;border-color:#c6d9fa!important;border-radius:5px!important}
    .linked-download-box .linked-queue-controls{position:static;grid-column:3;grid-row:1;padding-right:5px;gap:3px}
    .linked-queue-controls:has(button:not([hidden]))~.linked-download-options{padding-top:2px}
    .linked-queue-controls #endLinkedTask,.linked-queue-controls #retryUnfinishedProducts,.linked-queue-controls #toggleLinkedDownload{min-height:23px;font-size:9px;padding:3px;border-radius:4px}
    .linked-download-options{grid-column:1/-1;gap:5px;justify-content:space-between;padding:1px 9px 10px}
    .linked-download-options label{font-size:11px;gap:4px;color:#557093}
    .linked-download-options input{width:12px;height:12px}
    #linkStatus,#batchCollectorStatus,#materialStatus,#unfinishedProductCount{font-size:10px;color:#72829a;line-height:1.6}
    #linkStatus:not(:empty){margin-top:7px}
    #manageWordDictionary{margin-top:0!important;min-height:32px;border:1px solid #dce3ed;background:#fff;color:#60718b;font-size:11px;border-radius:7px;margin-bottom:10px}
    .actions{gap:6px;border-top:1px solid #e1e7ef;padding-top:11px}
    .actions button{min-height:34px;font-size:10px;border-radius:7px;white-space:nowrap}
    #extract{background:#fff7e7;border-color:#f0dfb6;color:#a87920}
    #stats{background:#eaf7f0;border-color:#c9e8d7;color:#328461}
    #todayStats{background:#edf3ff;border-color:#ccdcf8;color:#366fc3}
  #checkForUpdates{margin-left:auto;width:auto;min-height:26px;padding:3px 7px;font-size:11px;white-space:nowrap}#updateStatus{font-size:11px;line-height:1.5;color:#65758c;overflow-wrap:anywhere}#updateStatus:not(:empty){margin-bottom:10px}
.related-tools{margin-top:14px;padding-top:12px;border-top:1px solid #e1e7ef}.related-tools-title{margin:0 0 8px;color:#65758c;font-size:11px;font-weight:600}.related-tools-links{display:grid;gap:6px}.related-tool{display:block;padding:8px 10px;border:1px solid #dce3ed;border-radius:7px;background:#fff;color:#43536a;text-decoration:none;font-size:12px;font-weight:600;text-align:center}.related-tool:hover{background:#edf3ff;border-color:#b0c9f4;color:#2563eb}.related-tool:focus-visible{outline:2px solid #93b8ff;outline-offset:2px}
.related-tools{margin-top:10px;padding-top:8px}.related-tools-title{display:flex;align-items:center;justify-content:space-between;margin:0;padding:5px 0;cursor:pointer;list-style:none;user-select:none}.related-tools-title::-webkit-details-marker{display:none}.related-tools-title:focus-visible{outline:2px solid #93b8ff;outline-offset:2px;border-radius:4px}.related-tools-arrow{font-size:15px;color:#8796ac;transition:transform .15s}.related-tools[open] .related-tools-arrow{transform:rotate(180deg)}.related-tools-links{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:5px}.related-tool{padding:6px 4px;font-size:10px;line-height:1.4;border-radius:6px}.related-tool:first-child{grid-column:1/-1}
/* Keep scrolling inside a stable popup viewport. */
    html{width:350px;overflow:hidden}
    body{width:350px;max-height:580px;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#bac6d7 #f5f7fb}
    body::-webkit-scrollbar{width:7px}
    body::-webkit-scrollbar-track{background:#f5f7fb}
    body::-webkit-scrollbar-thumb{background:#bac6d7;border:2px solid #f5f7fb;border-radius:8px}
    body::-webkit-scrollbar-thumb:hover{background:#91a3bc}
    .related-tools-title{min-height:28px;line-height:18px;padding:5px 0;gap:8px}
    .related-tools-arrow{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;flex:0 0 20px;font-size:inherit;color:#7b8da6;transform:none;transition:transform .18s ease;transform-origin:50% 50%}
    .related-tools-arrow svg{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .related-tools-title:hover .related-tools-arrow{color:#2563eb}
    .related-tools[open] .related-tools-arrow{transform:rotate(180deg)}
    @media(prefers-reduced-motion:reduce){.related-tools-arrow{transition:none}}

    .utility-controls{display:grid;grid-template-columns:1fr 1fr 1.12fr;gap:5px;margin:8px 0 10px;padding:0;background:transparent;border:0;border-radius:0}
    .utility-controls #manageWordDictionary,.utility-controls .utility-toggle{display:flex;align-items:center;justify-content:center;gap:4px;height:34px;min-height:34px;min-width:0;margin:0;padding:0 4px;border:1px solid #dce3ed;border-radius:6px;background:#fff;color:#52647b;font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
    .utility-controls #manageWordDictionary{color:#304b70}
    .utility-controls .utility-toggle input[type="checkbox"]{flex:0 0 12px;width:12px;height:12px;margin:0;padding:0;accent-color:#2563eb;box-shadow:none}
    .utility-controls .utility-toggle:has(input:checked){background:#eaf1ff;border-color:#b8d0fa;color:#2563eb}
    .utility-controls #manageWordDictionary:hover,.utility-controls .utility-toggle:hover{background:#e2ecff;border-color:#9dbcf0}
    .utility-controls .utility-toggle:focus-within{outline:2px solid #93b8ff;outline-offset:2px}
</style>

<body>
  <h1>Ethan 工单助手<button id="checkForUpdates" type="button">检查更新</button></h1><div id="updateStatus" role="status"></div>

  <div class="setting">
    <div class="setting-title">
      <span><label for="operatorName">操作人员</label></span>
      <span id="settingStatus" role="status"></span>
    </div>
    <div id="operatorUndo" role="status"></div>
    <div class="operator-row">
      <input id="operatorName" type="text" maxlength="30" placeholder="例如：姜鑫洋" autocomplete="off" spellcheck="false">
      <button id="saveOperator" type="button">保存</button>
    </div>
  </div>

  <div class="link-tools">
    <div class="setting-title">
      <button id="getPageProductLinks" type="button">获取当前页产品链接</button>
      <button id="getShopProductLinks" type="button">获取全店链接</button>
      <button id="clearProductLinks" type="button">清除</button>
    </div>
    <textarea id="productLinks" aria-label="产品链接列表" rows="2" placeholder="每行一个产品链接或 ID" spellcheck="false"></textarea>
    <div class="product-action-grid">
      <button id="openProductLinks" type="button">新窗口批量打开</button>
      <button id="saveProductLinksTxt" type="button">保存为txt</button>

      <button id="openBatchCollector" type="button">采集当前页</button>
      <button id="downloadAllTabMaterials" type="button">下载所有标签页</button>
    </div>
    <div class="linked-download-box">
      <button id="linkedSpeedMode" type="button" title="切换下载节奏" aria-label="下载节奏：快速" style="position:absolute;left:6px;top:7px;z-index:2;width:38px;height:24px;min-height:24px;box-sizing:border-box;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid #a9ceff;border-radius:5px;background:#fff;color:#2563eb;font-size:11px;line-height:1;white-space:nowrap">快速</button>
      <button id="downloadLinkedProducts" type="button">批量下载链接</button>
      <div class="linked-queue-controls"><button id="endLinkedTask" type="button" hidden>结束任务</button><button id="retryUnfinishedProducts" type="button" hidden>重试未完成商品</button><button id="toggleLinkedDownload" type="button" hidden>停止下载</button></div>
      <div class="linked-download-options" role="group" aria-label="下载素材类型">
        <label><input type="checkbox" data-download-kind="video" checked>视频</label>
        <label><input type="checkbox" data-download-kind="main" checked>主图</label>
        <label><input type="checkbox" data-download-kind="detail" checked>详情</label>
        <label><input type="checkbox" data-download-kind="stitch" checked>长图</label>
        <label><input type="checkbox" data-download-kind="sku" checked>SKU</label>
      </div>
    </div>
    <div id="linkStatus" role="status"></div>
    <div id="batchCollectorStatus" role="status"></div>
    <div id="materialStatus" role="status"></div>
    <div id="unfinishedProductCount" role="status"></div>
  </div>

  <div class="utility-controls" aria-label="辅助工具">
    <button id="manageWordDictionary" type="button" title="打开极限词库管理">极限词库管理</button>
    <label class="utility-toggle" title="悬停网页图片时显示 PS 按钮，点击置入 Photoshop">
      <input id="psImageEnabled" type="checkbox"><span>图片置入PS</span>
    </label>
    <label class="utility-toggle" title="商品内容稳定加载后自动关闭1688可选弹窗，登录与纯验证页面不自动操作">
      <input id="autoClose1688Popups" type="checkbox"><span>1688弹窗关闭</span>
    </label>
  </div>
  <div class="actions">
    <button id="extract">本月待确认工单</button>
    <button id="stats">待处理+处理中</button>
    <button id="todayStats">今日完成工单</button>
  </div>
  <div id="status" role="status"></div>
  <div class="result" id="resultBox">
    <textarea id="statsText" readonly spellcheck="false"></textarea>
    <button id="copyStats">再次复制统计结果</button>
  </div>
  <details class="related-tools">
    <summary class="related-tools-title">相关工具<span class="related-tools-arrow" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16" focusable="false"><path d="m4 6 4 4 4-4"/></svg></span></summary>
    <div class="related-tools-links">
      <a class="related-tool" href="https://github.com/jeffjiang137/image-slicer-tauri/releases/download/v1.0.41/Xinyang-Designer-1.0.41-x64-setup.exe" target="_blank" rel="noopener noreferrer">鑫洋设计助手桌面版</a>
      <a class="related-tool" href="https://github.com/jeffjiang137/xinyang-photoshop-cep-assistant/archive/refs/heads/main.zip" target="_blank" rel="noopener noreferrer">鑫洋助手ps插件</a>
      <a class="related-tool" href="https://image-slicer-web.netlify.app/" target="_blank" rel="noopener noreferrer">拼图助手网页版</a>
    </div>
  </details>
  <script src="popup.js"></script>
  <script src="update-check.js"></script>
</body>
</html>
